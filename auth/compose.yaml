include:
  - compose.support.yaml

services:
  auth:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth
      SPRING_DATASOURCE_USERNAME: auth_app
      SPRING_DATASOURCE_PASSWORD: auth_dev_password
      AUTH_OIDC_ISSUER: http://localhost:8080
      AUTH_OIDC_ALLOWED_ORIGINS: http://localhost:3000
      AUTH_OIDC_PRIVATE_KEY_LOCATION: file:/run/secrets/auth/jwt-private.pem
      AUTH_OIDC_PUBLIC_KEY_LOCATION: file:/run/secrets/auth/jwt-public.pem
      AUTH_OIDC_CLIENTS_CONFIG_LOCATION: file:/run/config/oidc-clients.local.json
      AUTH_WEBAUTHN_RP_NAME: General Fullstack Dev
      AUTH_WEBAUTHN_RP_ID: localhost
      AUTH_WEBAUTHN_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:3000
      S3_ENDPOINT_URL: http://s3:8333
      S3_BUCKET: auth-files
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-auth_dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-auth_dev_secret}
      S3_REGION: ${S3_REGION:-us-east-1}
      OPENFGA_BASE_URL: http://openfga:8080
    ports:
      - "8080:8080"
    volumes:
      - ./secrets:/run/secrets/auth:ro
      - ./oidc-clients.local.json:/run/config/oidc-clients.local.json:ro
