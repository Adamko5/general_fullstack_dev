spring:
  application:
    name: auth
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth}
    username: ${SPRING_DATASOURCE_USERNAME:auth_app}
    password: ${SPRING_DATASOURCE_PASSWORD:auth_dev_password}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

auth:
  oidc:
    issuer: ${AUTH_OIDC_ISSUER:http://localhost:8080}
    allowed-origins: ${AUTH_OIDC_ALLOWED_ORIGINS:http://localhost:3000}
    signing-key-id: ${AUTH_OIDC_SIGNING_KEY_ID:local-rsa-1}
    private-key-location: ${AUTH_OIDC_PRIVATE_KEY_LOCATION:file:./secrets/jwt-private.pem}
    public-key-location: ${AUTH_OIDC_PUBLIC_KEY_LOCATION:file:./secrets/jwt-public.pem}
    clients-config-location: ${AUTH_OIDC_CLIENTS_CONFIG_LOCATION:file:./oidc-clients.local.json}
  webauthn:
    rp-name: ${AUTH_WEBAUTHN_RP_NAME:General Fullstack Dev}
    rp-id: ${AUTH_WEBAUTHN_RP_ID:localhost}
    allowed-origins: ${AUTH_WEBAUTHN_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}
